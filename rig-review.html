<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character articulation · The Last Dead</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}:root{color-scheme:dark;background:#121612;color:#e5dbc9;font:13px Arial,sans-serif}body{margin:0;height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header{padding:18px 24px;border-bottom:1px solid #4c4036}h1{font-size:24px;margin:5px 0}.eyebrow{font-size:10px;letter-spacing:.16em;color:#bc9475}header p{margin:6px 0;color:#aaa798;line-height:1.45}main{display:grid;min-height:0;grid-template-rows:auto minmax(0,1fr)}[data-status]{padding:12px 24px;color:#cbb898}canvas{min-height:0;width:100%;height:100%;display:block;touch-action:none}footer{padding:16px 24px max(16px,env(safe-area-inset-bottom));border-top:1px solid #4c4036;display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select{min-height:44px;padding:9px 12px;color:inherit;background:#232720;border:1px solid #655044;border-radius:2px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#54352b;border-color:#c38669}button:hover{border-color:#c9af89}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #d6b783;outline-offset:3px}label{display:flex;align-items:center;gap:7px}input{width:110px;min-height:44px}output{color:#aaa798;line-height:1.45;font-size:11px} @media(max-width:600px){header{padding:12px 16px}h1{font-size:21px}footer{padding:10px 16px max(10px,env(safe-area-inset-bottom));gap:6px}button,select{font-size:11px;padding:7px 9px}[data-status]{padding:9px 16px;font-size:12px}header p{font-size:12px}output{width:100%}}
</style></head><body>
<header><span class="eyebrow">THE LAST DEAD / CHARACTER RIG REVIEW</span><h1>Jaw and grip articulation</h1><p>Inspect the rig through the game's model wrapper. Drag to orbit; scroll to inspect. This bench does not simulate damage.</p></header>
<main><div data-status role="status">Loading original and rigged characters…</div><canvas aria-label="Character rig inspection"></canvas></main>
<footer>
<button data-asset="rigged" aria-pressed="true">Rigged</button><button data-asset="original" aria-pressed="false">Original</button>
<button data-pose="neutral" aria-pressed="true">Neutral</button><button data-pose="open">Jaw open</button><button data-pose="grip">Grip</button><button data-pose="bite">Bite preparation</button>
<label>Jaw<input data-jaw type="range" min="0" max="1" step="0.01" value="0"></label>
<label>Clip<select data-clip><option value="rest">Rest pose</option><option value="idle">Idle</option><option value="shuffle">Shuffle</option><option value="chase">Chase</option><option value="attack">Attack</option><option value="hit">Recoil</option><option value="collapse">Collapse</option></select></label>
<button data-play>Play clip</button><button data-view="head">Head</button><button data-view="hand">Hand</button><button data-view="body">Body</button><output data-metrics></output>
</footer><script type="module" src="./rig-review.js"></script></body></html>
