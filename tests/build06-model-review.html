<!doctype html><html><head><meta charset="utf-8"><title>Build 06 model review</title><style>body{margin:0;background:#202328;color:#ddd;font:12px monospace}canvas{display:block}aside{position:absolute;left:18px;top:18px;pointer-events:none;white-space:pre}</style></head><body><aside id="stats"></aside><script type="module">
import * as T from '../vendor/three.module.js';
import {createReliquary,animateReliquary} from '../weapon-reliquary.js';
import {createBellwraith,animateBellwraith} from '../npc-bellwraith.js';
import {createOssuary,animateOssuary} from '../weapon-ossuary.js';
const q=new URLSearchParams(location.search),name=q.get('asset')||'reliquary',view=q.get('view')||'three-quarter';
const scene=new T.Scene();scene.background=new T.Color(0x202328);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xc7d8e8,0x514339,2.1));for(const [pos,color,power]of[[[4,5,3],0xffead2,4.2],[[-3,2,-3],0xbacfee,3],[[0,-1,-2],0xff6644,.7]]){const light=new T.DirectionalLight(color,power);light.position.set(...pos);scene.add(light);}
const tile=document.createElement('canvas');tile.width=512;tile.height=256;const ctx=tile.getContext('2d');ctx.fillStyle='#5b646d';ctx.fillRect(0,0,512,256);ctx.fillStyle='#f5ecdb';ctx.fillRect(36,35,105,130);ctx.fillStyle='#aabfcf';ctx.fillRect(340,25,58,160);const texture=new T.CanvasTexture(tile);texture.mapping=T.EquirectangularReflectionMapping;texture.colorSpace=T.SRGBColorSpace;const pmrem=new T.PMREMGenerator(renderer);const env=pmrem.fromEquirectangular(texture);scene.environment=env.texture;
const model=name==='bellwraith'?createBellwraith():name==='ossuary'?createOssuary():createReliquary();scene.add(model);const box=new T.Box3().setFromObject(model),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());model.position.sub(center);const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);const sign=name==='bellwraith'?1:-1;const vectors={'three-quarter':[1,.32,sign*1.4],front:[0,.1,sign],side:[1,.15,0],rear:[0,.15,-sign]};const direction=new T.Vector3(...(vectors[view]||vectors['three-quarter'])).normalize();const distance=Math.max(size.y,size.x/camera.aspect,size.z)*2.05;camera.position.copy(direction.multiplyScalar(distance));camera.lookAt(0,0,0);
let meshes=0,triangles=0;model.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;}});renderer.render(scene,camera);window.review={asset:name,view,meshes,triangles,bounds:size.toArray(),calls:renderer.info.render.calls,failedPrograms:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length};document.querySelector('#stats').textContent=JSON.stringify(window.review,null,2);window.reviewReady=true;
</script></body></html>
