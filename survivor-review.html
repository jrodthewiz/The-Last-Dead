<!doctype html><html><head><meta charset="utf-8"><title>Survivor model review</title><style>body{margin:0;background:#24262a;color:#ddd;font:14px monospace}canvas{display:block}header{position:absolute;left:22px;top:18px;pointer-events:none}</style></head><body><header>SURVIVOR // MODEL REVIEW</header><script type="module">
import * as T from './vendor/three.module.js';import{createSurvivor,animateSurvivor}from './assets/survivor/player-survivor.js';const q=new URLSearchParams(location.search),scene=new T.Scene();scene.background=new T.Color(0x303239);const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.01,30);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xe0e4ed,0x40352e,2));for(const [pos,col,power]of[[[-3,5,-4],0xffead5,3],[[3,3,2],0xaccbff,3]]){let l=new T.DirectionalLight(col,power);l.position.set(...pos);scene.add(l);}const model=createSurvivor({firstPerson:q.has('down')});if(q.has('down'))model.position.z=.08;scene.add(model);const ground=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:0x292b2d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.007;scene.add(ground);let angle=Number(q.get('angle')||0);camera.position.set(Math.sin(angle)*3.35,1.18,-Math.cos(angle)*3.35);camera.lookAt(0,.88,0);if(q.has('down')){model.userData.head.visible=false;model.userData.arms.forEach(a=>a.shoulder.visible=false);camera.position.set(0,1.6,-.025);camera.rotation.set(-1.30,0,0);camera.fov=92;camera.updateProjectionMatrix();}if(q.has('face')){camera.position.set(-.42,1.7,-.65);camera.lookAt(0,1.64,-.01);}function draw(){renderer.render(scene,camera);requestAnimationFrame(draw);}draw();window.review={model,scene,camera,renderer,animateSurvivor};</script></body></html>
