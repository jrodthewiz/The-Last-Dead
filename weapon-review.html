<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weapon review / The Last Dead</title><style>body{margin:0;background:#17191d;color:#eee;font:14px system-ui}canvas{display:block}nav{position:fixed;left:16px;top:16px;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 32px)}button,select{background:#242526;border:1px solid #777;color:#eee;padding:10px;cursor:pointer}#stats{position:fixed;bottom:16px;left:16px;color:#baa}</style></head><body><nav><select aria-label="Weapon" id="select"><option>Ossuary</option><option>Breach</option><option>Arc Lance</option><option>Reliquary</option></select><button id="fire">Fire</button><button id="rotate">Rotate</button></nav><output id="stats"></output><script type="module">
import * as THREE from './vendor/three.module.js';
import {createOssuary,animateOssuary} from './weapon-ossuary.js';
import {createBreach,animateBreach} from './weapon-breach.js';
import {createArc,animateArc} from './weapon-arc.js';
import {createReliquary,animateReliquary} from './weapon-reliquary.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17191d);scene.add(new THREE.HemisphereLight(0xc2d0e0,0x342015,1.4));const key=new THREE.DirectionalLight(0xffe4c6,3);key.position.set(-3,4,-4);scene.add(key);const rim=new THREE.DirectionalLight(0xe95768,2);rim.position.set(3,2,2);scene.add(rim);
// Match the game's soft studio environment so metal is judged with reflections.
const reviewEnvironment=document.createElement('canvas');reviewEnvironment.width=512;reviewEnvironment.height=256;const ec=reviewEnvironment.getContext('2d'),eg=ec.createLinearGradient(0,0,0,256);eg.addColorStop(0,'#aebacb');eg.addColorStop(.5,'#62666a');eg.addColorStop(1,'#28232a');ec.fillStyle=eg;ec.fillRect(0,0,512,256);for(let i=0;i<5;i++){ec.fillStyle=i%2?'#ffe3c3':'#e9f2ff';ec.fillRect(32+i*95,35,47,33);}const et=new THREE.CanvasTexture(reviewEnvironment);et.mapping=THREE.EquirectangularReflectionMapping;et.colorSpace=THREE.SRGBColorSpace;const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(et).texture;et.dispose();pmrem.dispose();
const guns=[createOssuary(),createBreach(),createArc(),createReliquary()];guns.forEach((g,i)=>{g.visible=i===0;scene.add(g);});const camera=new THREE.PerspectiveCamera(35,1,.01,30),target=new THREE.Vector3();let index=0,angle=-.4,shot=0,last=0,rotating=false,distance=2.4;
function setView(a){angle=a;camera.position.copy(target).add(new THREE.Vector3(-Math.cos(a)*distance,distance*.27,Math.sin(a)*distance));camera.lookAt(target);renderer.render(scene,camera);}
function select(i){index=i;guns.forEach((g,j)=>g.visible=i===j);const bounds=new THREE.Box3().setFromObject(guns[i]);bounds.getCenter(target);const size=bounds.getSize(new THREE.Vector3());distance=Math.max(size.length()*1.25,1.8);shot=0;document.querySelector('#select').value=document.querySelector('#select').options[i].value;setView(angle);}
window.__WEAPON__={get gun(){return guns[index]},guns,renderer,scene,camera,setView,select,fire(){shot=1;}};
document.querySelector('#select').onchange=e=>select(e.target.selectedIndex);document.querySelector('#fire').onclick=()=>shot=1;document.querySelector('#rotate').onclick=()=>rotating=!rotating;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();setView(angle);}addEventListener('resize',resize);resize();select(0);
function frame(t){const dt=last?Math.min(.05,(t-last)/1000):.016;last=t;shot=Math.max(0,shot-dt*5.2);const time=t/1000;if(index===0)animateOssuary(guns[0],shot,time,dt);if(index===1)animateBreach(guns[1],time,shot,dt);if(index===2)animateArc(guns[2],time,shot,dt);if(index===3)animateReliquary(guns[3],shot,time,dt);if(rotating)setView(angle+dt*.25);renderer.render(scene,camera);document.querySelector('#stats').textContent=renderer.info.render.calls+' calls / '+renderer.info.render.triangles.toLocaleString()+' triangles';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
