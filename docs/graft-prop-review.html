<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Dead · Graft Prop Review</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#131514; color:#e5dacb; font:13px system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  header { position:fixed; top:20px; left:24px; letter-spacing:.15em; text-transform:uppercase; font-weight:700; }
</style>
<header>Graft theatre · covered specimen</header>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import { makeDungeonCourse } from '../playground/map/dungeon-course.js';
import { buildDungeonLandmark } from '../dungeon-architecture.js';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x15191b);
scene.add(new THREE.HemisphereLight(0xc8d8d6,0x362628,2.2));
const key = new THREE.DirectionalLight(0xffdbc0,3);
key.position.set(-5,9,8); scene.add(key);
const material = (color,roughness=.8) => new THREE.MeshStandardMaterial({color,roughness});
const steelMap = new THREE.TextureLoader().load('../assets/textures/dread-worn-steel-v1.webp');
steelMap.colorSpace = THREE.SRGBColorSpace;
const steel = new THREE.MeshStandardMaterial({map:steelMap,color:0xaeb4b0,roughness:.8,metalness:.3});
const materials = {black:material(0x171719),metalDark:steel,weaponDark:steel,steel,metal:steel,rust:material(0x795345),red:material(0x8e363d),orange:material(0xd18d44),gore:material(0x74363c),glass:material(0x8d9994)};
const course = makeDungeonCourse(1);
const item = course.landmarks.find(entry => entry.id === 'f2-theater-table');
const prop = buildDungeonLandmark(item,materials,course,{moving:[],motion:[],anchors:{},lights:[]});
prop.position.set(0,0,0); scene.add(prop);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(15,15),material(0x323739,.95));
ground.rotation.x = -Math.PI/2; ground.position.y = -.04; scene.add(ground);
const camera = new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,100);
camera.position.set(7,5.2,7.5); camera.lookAt(0,1.7,0);
const render = () => renderer.render(scene,camera);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});
setTimeout(render,500); render();
</script>
</html>
