<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Survivor body playground</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101413;color:#ece4d3;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:18px;left:18px;width:240px;padding:18px;background:#101413ec;border:1px solid #5b6052;border-radius:6px}h1{font-size:18px;margin:0 0 5px}p{font-size:12px;color:#bbb6a7}label{display:block;margin:12px 0 4px}select,input,button{width:100%;accent-color:#caac72}select,button{padding:7px;background:#252c27;color:#ece4d3;border:1px solid #606852}output{display:block;margin-top:12px;font-size:12px;color:#d0b47b}body.capture aside{display:none}@media(max-width:600px){aside{width:190px;font-size:12px;padding:10px}}</style></head>
<body><canvas id="world"></canvas><aside><h1>Survivor body</h1><p>First-person pose playground</p><label>Implementation</label><select id="version"><option value="candidate">Promoted body</option><option value="baseline">Before fix</option></select><label>Pose</label><select id="pose"><option>standing</option><option>walking</option><option>slide</option><option>jump</option></select><label>Camera</label><select id="view"><option value="first">First person</option><option value="front">Front</option><option value="left35">Left three-quarter</option><option value="right35">Right three-quarter</option><option value="rear">Rear</option></select><label>Look down</label><input id="pitch" type="range" min="-1.35" max="0.7" step=".01" value="-1.30"><label>Weapon</label><select id="weapon"><option value="0">Ossuary</option><option value="1">Breach</option><option value="2">Arc Lance</option><option value="3">Reliquary</option></select><label><input style="width:auto" id="animate" type="checkbox"> Animate movement</label><label><input style="width:auto" id="explode" type="checkbox"> Inspect separated parts</label><button id="worldToggle">Studio / arena</button><output id="status">Preparing preview...</output></aside><script type="module" src="./playground/survivor/playground.js"></script></body></html>
