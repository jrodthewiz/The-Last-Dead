name: Blackwater private browser QA
on:
  workflow_dispatch:
    inputs:
      target:
        description: Browser QA target
        type: choice
        options: [loopback, hosted]
        default: loopback
  push:
    branches: [codex/private-bridge-qa, 'codex/blackwater-art-*', codex/blackwater-hosted-qa]
permissions:
  contents: read
jobs:
  cpu-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/qa" playwright@1.56.1
      - name: Exercise the game with SwiftShader
        env:
          BLACKWATER_QA_HOSTED: ${{ (inputs.target == 'hosted' || github.ref == 'refs/heads/codex/blackwater-hosted-qa') && '1' || '0' }}
        run: CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_PATH="$RUNNER_TEMP/qa/node_modules/playwright" node tests/private-bridge-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && (github.event.repository.private || inputs.target == 'hosted' || github.ref == 'refs/heads/codex/blackwater-hosted-qa' || startsWith(github.ref, 'refs/heads/codex/blackwater-art-'))
        with:
          name: gameplay-${{ github.sha }}
          path: output/playwright/private-bridge/
          retention-days: 7
  visual-views:
    if: startsWith(github.ref, 'refs/heads/codex/blackwater-art-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        scene: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.scene == 'baseline'
        with:
          ref: 4a5a99cc026bccf5594ebdbc4dc51b88919cdc98
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/qa" playwright@1.56.1
      - name: Capture from a fresh game using the same camera and renderer
        env:
          BLACKWATER_QA_ROOT: ${{ matrix.scene == 'baseline' && 'baseline' || '.' }}
          BLACKWATER_QA_VISUAL: only
        run: CHROME_PATH="$(command -v google-chrome)" PLAYWRIGHT_PATH="$RUNNER_TEMP/qa/node_modules/playwright" node tests/private-bridge-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.scene }}-views
          path: output/playwright/private-bridge/
          retention-days: 7
