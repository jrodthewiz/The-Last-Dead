name: Blackwater private browser QA
on:
  workflow_dispatch:
  push:
    branches: [codex/private-bridge-qa]
permissions:
  contents: read
jobs:
  cpu-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/qa" playwright@1.56.1
      - run: '"$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Exercise the private loopback game
        run: PLAYWRIGHT_PATH="$RUNNER_TEMP/qa/node_modules/playwright" node tests/private-bridge-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event.repository.private
        with:
          name: private-browser-${{ github.sha }}
          path: output/playwright/private-bridge/
          retention-days: 7
