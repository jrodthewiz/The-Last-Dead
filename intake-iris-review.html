<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intake Containment Iris Review</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#080a11}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="review"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { buildAuthoredWorld } from './world-authored.js';

const canvas = document.querySelector('#review');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1); renderer.setSize(1280, 800, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x080a11); scene.fog = new THREE.Fog(0x080a11, 18, 42);
const camera = new THREE.PerspectiveCamera(40, 1.6, .05, 80);
const mats = {
  black: new THREE.MeshStandardMaterial({ color: 0x060a11, roughness: .8, metalness: .2 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 0x202936, roughness: .48, metalness: .82 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x8794a5, roughness: .4, metalness: .88 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xb1bfcc, roughness: .28, metalness: .92 }),
  rust: new THREE.MeshStandardMaterial({ color: 0x742d37, roughness: .72, metalness: .35 }),
  hazard: new THREE.MeshStandardMaterial({ color: 0xc76b2b, roughness: .4, metalness: .58 }),
  red: new THREE.MeshStandardMaterial({ color: 0xef405f, emissive: 0xef405f, emissiveIntensity: 1.75, roughness: .26, metalness: .1 }),
  orange: new THREE.MeshStandardMaterial({ color: 0xff8c42, emissive: 0xff8c42, emissiveIntensity: 1.5, roughness: .3, metalness: .2 }),
  enemyRed: new THREE.MeshStandardMaterial({ color: 0x962f49, roughness: .58, metalness: .48 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x0a2430, roughness: .08, metalness: .25, clearcoat: .9, clearcoatRoughness: .14, transmission: .14, transparent: true, opacity: .9 }),
};
const stage = new THREE.Group();
const result = buildAuthoredWorld(stage, mats, { sectorId: 'bloodworks', setpieces: [{ id: 'intake-pressure-door', type: 'pressure-door', anchor: [6, 6], width: 1.7, height: 5.05, cue: 'red' }], landmarks: [], machinery: [], lights: [] });
scene.add(stage);
const wall = new THREE.Mesh(new THREE.BoxGeometry(.24, 7.2, 11), mats.black); wall.position.set(23.25, 3.5, 24); wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x1a2029, roughness: .76, metalness: .35 })); floor.rotation.x = -Math.PI / 2; floor.position.set(24, 0, 24); floor.receiveShadow = true; scene.add(floor);
const key = new THREE.PointLight(0xffa15a, 80, 20, 2); key.position.set(31, 7, 20); key.castShadow = true; scene.add(key);
const fill = new THREE.PointLight(0x6f9dbe, 35, 18, 2); fill.position.set(29, 3, 29); scene.add(fill);
const rim = new THREE.PointLight(0xff3154, 30, 12, 2); rim.position.set(25, 5, 24); scene.add(rim);
const target = new THREE.Vector3(24, 2.68, 24);
function setView() {
  const view = new URLSearchParams(location.search).get('view') || 'front';
  const positions = { front: [31.5, 3.05, 24], angled: [30.4, 3.55, 28.8], side: [25.1, 3.1, 30.8] };
  camera.position.set(...(positions[view] || positions.front)); camera.lookAt(target);
}
setView();
window.__IRIS_REVIEW__ = { result, stage, camera, renderer, names: [] };
stage.traverse(object => { if (object.name?.startsWith('Iris')) window.__IRIS_REVIEW__.names.push(object.name); });
function frame(time) { result.animate?.(time * .001); renderer.render(scene, camera); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
